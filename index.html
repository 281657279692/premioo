<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Premio</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 60px 20px;
    background: #f5f5f5;
}
.box {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 5px 20px #ccc;
}
button {
    background: #16a34a;
    color: white;
    border: 0;
    padding: 15px 30px;
    border-radius: 10px;
    font-size: 18px;
}
.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="box" id="inicio">
    <h1>🎉 ¡ENHORABUENA!</h1>
    <p>Has sido seleccionado para recibir un premio.</p>
    <h2>💰 47,83 €</h2>
    <button onclick="mostrar()">VER MI PREMIO</button>
</div>

<div class="box hidden" id="final">
    <h1>💀 JAJAJAJA</h1>
    <h2>VÁYASE A TRABAJAR, MI HERMANO.</h2>
    <p>¿De verdad pensabas que ibas a ganar dinero acostado?</p>
    <h3>QUIEN GANA DINERO ACOSTADO SON LAS PUTAS 😭</h3>
</div>

<script>
function mostrar() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("final").style.display = "block";
}
</script>

</body>
</html>
